name: build

on:
  push:
    branches:
      - "claude/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        tfm: [net8.0-windows10.0.19041.0, net10.0-windows10.0.19041.0]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore NetTrans/NetTrans.csproj -r win-x64

      - name: Build (${{ matrix.tfm }})
        run: dotnet build NetTrans/NetTrans.csproj -c Release -f ${{ matrix.tfm }} -r win-x64 --no-restore

      # P2-9 verification: Strings/<lang>/Resources.resw must actually reach the
      # build output as resources.pri, otherwise language switching has nothing
      # to switch to. The XAML/C# build alone cannot prove this.
      - name: Verify localized resources (P2-9)
        shell: pwsh
        run: |
          $all = Get-ChildItem -Path NetTrans -Filter *.pri -Recurse -File | Where-Object { $_.FullName -notlike "*\obj\*" }
          $all | ForEach-Object { Write-Host ("PRI found: {0} ({1} bytes)" -f $_.FullName, $_.Length) }
          $pri = $all | Where-Object { $_.Name -ieq "resources.pri" } | Select-Object -First 1
          if (-not $pri) { throw "resources.pri was not produced - resw files are not packaged" }
